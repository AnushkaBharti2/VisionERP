spring.application.name=visionerp-backend
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visionerp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:visionerp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET:change-this-only-for-local-development-please-use-a-strong-secret-32chars}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
visionerp.admin.email=${SEED_ADMIN_EMAIL:}
visionerp.admin.password=${SEED_ADMIN_PASSWORD:}
